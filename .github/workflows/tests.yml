name: QA Automation

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:dry
      - run: npm run evidencias
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-desafio-api-1-e-frontend-2
          path: |
            evidencias/
            reports/*.html
            reports/desafio-api-1.json
            reports/desafio-frontend-2.json
